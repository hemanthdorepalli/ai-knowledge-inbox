# Render blueprint for the backend. Deploy via Render Dashboard -> New ->
# Blueprint, pointing at this repo. Render reads this file automatically.
# (You can also skip this file and configure the same settings by hand in the
# dashboard — see the deploy notes for that path.)
services:
  - type: web
    name: ai-knowledge-inbox-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      # Embeddings: Gemini. Chat: Groq (Gemini's chat free tier is ~20/day).
      - key: GEMINI_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIM
        value: "768"
      - key: GROQ_API_KEY
        sync: false
      - key: CHAT_MODEL
        value: llama-3.3-70b-versatile
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # PUBLIC_HOST is intentionally omitted: on Render the demo MCP server
      # auto-detects the hostname from RENDER_EXTERNAL_HOSTNAME. Set PUBLIC_HOST
      # by hand only to override it or when deploying elsewhere.
